<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISD Frido Manpower Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9fafb; margin: 0; padding: 30px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 26px; margin-bottom: 5px; color: #111; }
        p.subtitle { color: #666; margin-top: 0; font-size: 14px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; font-weight: 600; color: #444; }
        tr:hover { background-color: #f1f5f9; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge.checked-in { background: #d1e7dd; color: #0f5132; }
        .badge.completed { background: #cff4fc; color: #055160; }
        .badge.week-off { background: #e2e3e5; color: #41464c; }
        .badge.pending { background: #f8d7da; color: #842029; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ISD Frido Manpower Live Status</h1>
        <p class="subtitle" id="last-updated">Fetching latest data...</p>
        <table>
            <thead>
                <tr>
                    <th>Agent Name</th>
                    <th>Vertical</th>
                    <th>Morning Slack</th>
                    <th>Evening Slack</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="dashboard-body">
            </tbody>
        </table>
    </div>

    <script>
        async function loadData() {
            try {
                // Fetching the JSON generated by your Python script
                const response = await fetch('public/dashboard.json');
                const data = await response.json();
                
                const tbody = document.getElementById('dashboard-body');
                tbody.innerHTML = '';
                
                data.forEach(emp => {
                    let badgeClass = 'pending';
                    if (emp.final_status === 'Checked In') badgeClass = 'checked-in';
                    if (emp.final_status === 'Completed Shift') badgeClass = 'completed';
                    if (emp.final_status === 'Week Off') badgeClass = 'week-off';

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${emp.agent_name}</strong><br><small style="color: #888;">${emp.email}</small></td>
                            <td>${emp.vertical}</td>
                            <td>${emp.morning_status}</td>
                            <td>${emp.evening_status}</td>
                            <td><span class="badge ${badgeClass}">${emp.final_status}</span></td>
                        </tr>
                    `;
                });
                
                document.getElementById('last-updated').innerText = `Live Status • Last synced: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                document.getElementById('last-updated').innerText = "Waiting for the bot to finish its first sync... Check back in 1 minute.";
            }
        }
        
        loadData();
        // Refresh the browser view every 60 seconds automatically
        setInterval(loadData, 60000);
    </script>
</body>
</html>
